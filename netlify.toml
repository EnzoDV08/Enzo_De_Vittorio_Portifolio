# Netlify hosts the live site from EnzoDV08/Enzo_De_Vittorio_Portifolio main.
# These settings override the site's UI settings: every deploy
# (live or pull-request preview) type-checks, lints and builds, then publishes the prerendered
# site. Netlify's default caching already revalidates HTML and files like the CV on every request.
[build]
  command = "npm run typecheck && npm run lint && npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Device renders and tool logos keep their names between deploys (not fingerprinted), so they
# can't be immutable. A day fresh, then served from cache while it revalidates in the
# background: repeat visits show them at once instead of re-checking each one first.
[[headers]]
  for = "/devices/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
