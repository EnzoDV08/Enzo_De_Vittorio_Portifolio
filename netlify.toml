# Netlify build settings. They override the site's UI settings, so Netlify serves the same
# prerendered site as Firebase Hosting (see firebase.json). Netlify's default caching already
# revalidates HTML and files like the CV on every request.
[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
